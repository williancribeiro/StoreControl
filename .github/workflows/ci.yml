name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Start SQL Server with an ephemeral credential
        shell: bash
        run: |
          set -euo pipefail
          db_password="ScCi!9_$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "STORECONTROL_CI_SA_PASSWORD=$db_password" >> "$GITHUB_ENV"
          docker run --detach --name storecontrol-ci-sqlserver \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$db_password" \
            --publish 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04

          for attempt in {1..30}; do
            if docker exec storecontrol-ci-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$db_password" \
              -C -Q 'SELECT 1' -b -o /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs storecontrol-ci-sqlserver
          exit 1

      - name: Start Redis with an ephemeral credential
        shell: bash
        run: |
          set -euo pipefail
          redis_password="ScCiRedis_$(openssl rand -hex 24)"
          echo "::add-mask::$redis_password"
          echo "STORECONTROL_TEST_REDIS_CONNECTION=127.0.0.1:6379,password=$redis_password" >> "$GITHUB_ENV"
          docker run --detach --name storecontrol-ci-redis \
            --env REDIS_PASSWORD="$redis_password" \
            --publish 127.0.0.1:6379:6379 redis:8.2-alpine \
            sh -c 'exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"'
          for attempt in {1..15}; do
            if docker exec storecontrol-ci-redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Start RabbitMQ with an ephemeral credential
        shell: bash
        run: |
          set -euo pipefail
          rabbit_password="ScCiRabbit_$(openssl rand -hex 24)"
          echo "::add-mask::$rabbit_password"
          echo "STORECONTROL_TEST_RABBITMQ_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "STORECONTROL_TEST_RABBITMQ_PORT=5672" >> "$GITHUB_ENV"
          echo "STORECONTROL_TEST_RABBITMQ_USERNAME=storecontrol" >> "$GITHUB_ENV"
          echo "STORECONTROL_TEST_RABBITMQ_PASSWORD=$rabbit_password" >> "$GITHUB_ENV"
          echo "STORECONTROL_TEST_RABBITMQ_VHOST=/" >> "$GITHUB_ENV"
          docker run --detach --name storecontrol-ci-rabbitmq \
            --env RABBITMQ_DEFAULT_USER=storecontrol \
            --env RABBITMQ_DEFAULT_PASS="$rabbit_password" \
            --publish 127.0.0.1:5672:5672 rabbitmq:4.2-management-alpine
          for attempt in {1..30}; do
            if docker exec storecontrol-ci-rabbitmq rabbitmq-diagnostics -q check_port_connectivity; then
              exit 0
            fi
            sleep 2
          done
          docker logs storecontrol-ci-rabbitmq
          exit 1

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore backend
        run: dotnet restore StoreControl.sln

      - name: Build backend
        run: dotnet build StoreControl.sln --configuration Release --no-restore

      - name: Test backend
        shell: bash
        run: |
          export STORECONTROL_TEST_DB_CONNECTION="Server=localhost,1433;Database=master;User Id=sa;Password=${STORECONTROL_CI_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
          dotnet test StoreControl.sln --configuration Release --no-build

      - name: Validate migration script
        shell: bash
        run: |
          export STORECONTROL_DB_CONNECTION="Server=localhost,1433;Database=StoreControl_CI_Metadata;User Id=sa;Password=${STORECONTROL_CI_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
          dotnet ef migrations script --idempotent \
            --project backend/src/StoreControl.Infrastructure \
            --startup-project backend/src/StoreControl.Infrastructure \
            --context StoreControlDbContext \
            --output migration.sql

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/StoreControl.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/StoreControl.Web
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend/StoreControl.Web
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend/StoreControl.Web
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/StoreControl.Web
        run: npm run build
