name: storecontrol

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --save \"\" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-storecontrol}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    environment:
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose};Encrypt=False;TrustServerCertificate=True
      Seed__DemoDataEnabled: ${SEED_DEMO_DATA:-false}
      Seed__AdminPassword: ${DEMO_ADMIN_PASSWORD:-}
      Seed__UserPassword: ${DEMO_USER_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose};Encrypt=False;TrustServerCertificate=True
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
      Authentication__RefreshToken__CookieSecure: "false"
      AllowedHosts: localhost;127.0.0.1
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__RedisConnection: redis:6379,password=${REDIS_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
      Cache__KeyPrefix: ${CACHE_KEY_PREFIX:-storecontrol:local}
      Cache__DashboardTtlSeconds: ${CACHE_DASHBOARD_TTL_SECONDS:-30}
      Cache__CategoriesTtlSeconds: ${CACHE_CATEGORIES_TTL_SECONDS:-300}
      Cache__TimeoutMilliseconds: ${CACHE_TIMEOUT_MILLISECONDS:-500}
      Messaging__Enabled: ${MESSAGING_ENABLED:-true}
      Messaging__HostName: rabbitmq
      Messaging__Port: 5672
      Messaging__UserName: ${RABBITMQ_DEFAULT_USER:-storecontrol}
      Messaging__Password: ${RABBITMQ_DEFAULT_PASS:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
      Messaging__VirtualHost: /
      Messaging__TopologyPrefix: ${MESSAGING_TOPOLOGY_PREFIX:-storecontrol}
    ports:
      - "127.0.0.1:${API_PORT:-5090}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose};Encrypt=False;TrustServerCertificate=True
      Messaging__Enabled: ${MESSAGING_ENABLED:-true}
      Messaging__HostName: rabbitmq
      Messaging__Port: 5672
      Messaging__UserName: ${RABBITMQ_DEFAULT_USER:-storecontrol}
      Messaging__Password: ${RABBITMQ_DEFAULT_PASS:?Execute scripts/Initialize-LocalEnvironment.ps1 antes de iniciar o Compose}
      Messaging__VirtualHost: /
      Messaging__TopologyPrefix: ${MESSAGING_TOPOLOGY_PREFIX:-storecontrol}
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  sqlserver-data:
  rabbitmq-data:

networks:
  backend:
  edge:
