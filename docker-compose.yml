name: storecontrol

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    environment:
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      Seed__DemoDataEnabled: ${SEED_DEMO_DATA:-true}
      Seed__AdminPassword: ${DEMO_ADMIN_PASSWORD}
      Seed__UserPassword: ${DEMO_USER_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__RefreshToken__CookieSecure: "false"
    ports:
      - "127.0.0.1:${API_PORT:-5090}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__StoreControl: >-
        Server=sqlserver,1433;Database=${STORECONTROL_DATABASE:-StoreControl};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
